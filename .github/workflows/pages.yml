name: Deploy Owlery to GitHub Pages

# Publishes ONLY the app files listed below (not schema.sql, tests, scripts or the README),
# and writes config.js from encrypted repository secrets so no key ever lives in the repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage only the app files
        run: |
          mkdir _site
          cp index.html app.js sfx.js styles.css extra.css sw.js manifest.webmanifest \
             icon.svg icon-192.png icon-512.png robots.txt .nojekyll _site/

      - name: Write config.js from repository secrets
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY" || { echo "Add the SUPABASE_URL and SUPABASE_KEY repository secrets first (Settings > Secrets and variables > Actions)."; exit 1; }
          case "$SUPABASE_KEY" in sb_secret_*|eyJ*) echo "SUPABASE_KEY must be the PUBLISHABLE key (sb_publishable_...), never a secret/service_role key."; exit 1;; esac
          printf "window.CONFIG = { GIPHY_KEY: '%s', SUPABASE_URL: '%s', SUPABASE_KEY: '%s', DEMO: false };\n" "$GIPHY_KEY" "$SUPABASE_URL" "$SUPABASE_KEY" > _site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
